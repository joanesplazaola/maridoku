name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - name: Generation smoke
        run: |
          uv run murdoku-v2 scale-regression \
            --sizes 6 8 10 \
            --count-per-size 1 \
            --budget-seconds 30
      - name: Build static preview
        run: |
          uv run murdoku-v2 build-site --levels 50 --output _site
          test ! -e _site/solution.json
        env:
          MURDOKU_COMMIT: ${{ github.sha }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
