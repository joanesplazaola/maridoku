name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - name: Generation smoke
        run: |
          uv run murdoku-v2 scale-regression \
            --sizes 6 8 10 \
            --count-per-size 1 \
            --budget-seconds 30
      - name: Build static preview
        run: |
          mkdir -p _site
          uv run murdoku-v2 generate \
            --size 8 \
            --seed 42 \
            --output /tmp/murdoku-pages
          uv run murdoku-v2 render \
            --puzzle /tmp/murdoku-pages/puzzle.json \
            --output _site/index.html
          test ! -e _site/solution.json
          touch _site/.nojekyll
        env:
          MURDOKU_COMMIT: ${{ github.sha }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
