name: Release generation gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv run playwright install --with-deps chromium firefox webkit
      - name: Cross-browser QA
        run: uv run python scripts/browser_qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ github.sha }}
          path: qa-artifacts
          retention-days: 90
