name: Release generation gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - name: Validate 100 seeds per size
        run: |
          uv run murdoku-v2 scale-regression \
            --sizes 6 8 10 \
            --count-per-size 100 \
            --budget-seconds 30 \
            --output scaling-regression.json
      - uses: actions/upload-artifact@v4
        with:
          name: scaling-regression-${{ github.sha }}
          path: scaling-regression.json
          retention-days: 90
