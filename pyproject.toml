[project]
name = "murdoku-v2-gamma-cpsat"
version = "2.2.0a1"
description = "Generador y validador de Murdoku con Google OR-Tools CP-SAT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "ortools==9.15.6755",
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
murdoku-v2 = "murdoku_v2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/murdoku_v2"]
