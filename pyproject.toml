[project]
name = "murdoku-v2-gamma-cpsat"
version = "2.2.0a1"
description = "Motor V2-gamma de Murdoku con Google OR-Tools CP-SAT y validación multi-solver"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pydantic>=2.10",
  "networkx>=3.4",
  "rich>=13.9",
]

[project.optional-dependencies]
cpsat = ["ortools==9.15.6755"]
z3 = ["z3-solver>=4.13"]
solvers = [
  "z3-solver>=4.13",
  "ortools==9.15.6755",
]
dev = ["pytest>=8.0"]

[project.scripts]
murdoku-v2 = "murdoku_v2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/murdoku_v2"]
